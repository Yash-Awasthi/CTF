# Case Files — Local Development
# Usage: docker compose up
# Then open http://localhost:4321

version: "3.8"

services:
  dev:
    image: node:22.6-alpine
    container_name: ctf-dev
    working_dir: /app
    restart: unless-stopped
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "4321:4321"
    command: >
      sh -c "
        npm install -g pnpm@9 &&
        pnpm install &&
        cp -n .env.example .dev.vars 2>/dev/null || true &&
        pnpm dev --host 0.0.0.0
      "
    environment:
      - NODE_ENV=development
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4321/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "1.0"
          memory: 512M

volumes:
  node_modules:
