# Case Files — Local Development
# Usage: docker compose up
# Then open http://localhost:4321

services:
  dev:
    image: node:22-slim
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "4321:4321"
    command: >
      sh -c "
        npm install -g pnpm@9 &&
        pnpm install &&
        cp -n .env.example .dev.vars 2>/dev/null || true &&
        pnpm dev --host 0.0.0.0
      "
    environment:
      - NODE_ENV=development

  # Miniflare (local Cloudflare Workers runtime) — used by wrangler dev
  # Uncomment if you need isolated D1/R2:
  # miniflare:
  #   image: ghcr.io/cloudflare/miniflare:latest
  #   volumes:
  #     - .:/app
  #   working_dir: /app
  #   command: miniflare --d1 case-files-db --r2 case-files-assets

volumes:
  node_modules:
