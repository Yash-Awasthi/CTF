name: CTF CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'pnpm'

      # The repository is a pnpm project: packageManager pins pnpm and
      # pnpm-lock.yaml is the tracked lockfile.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # worker-configuration.d.ts is gitignored and generated from wrangler.jsonc.
      - name: Generate Worker types
        run: pnpm generate-types

      # tsgo is the TypeScript 7 compiler; astro check still needs the TypeScript 6
      # language service, so both are installed.
      - name: Run type checks
        run: pnpm typecheck

      - name: Run Astro checks
        run: pnpm astro check

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build
